plugins {
    id "com.android.application"
}

// Each GitHub Actions build gets a higher number, so a newer APK installs over an older one.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int
def siteUrl = (project.findProperty("appUrl") ?: "").toString().replaceAll('/+$', '')
if (!siteUrl.startsWith("https://")) {
    throw new GradleException("appUrl must be an https:// address, got '${siteUrl}'")
}

android {
    namespace "com.aicodestudio.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.aicodestudio.app"
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        buildConfigField "String", "APP_URL", "\"${siteUrl}\""
    }

    signingConfigs {
        // A fixed key kept in the repository so every build is signed the same way and
        // updates install over older builds. It is public: fine for sharing the APK
        // directly, not suitable for a Play Store release.
        shared {
            storeFile file("../keystore/app.p12")
            storeType "pkcs12"
            storePassword "android"
            keyAlias "aicodestudio"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
