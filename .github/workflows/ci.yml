name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-code-studio .
      - name: Start the image and check it responds
        run: |
          docker run -d --name studio -p 8000:8000 ai-code-studio
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/api/health && break
            sleep 1
          done
          curl -fs http://localhost:8000/api/status
          curl -fs http://localhost:8000/ | grep -q '<div id="root">'
          # Deployed images must stay locked until sign-in is configured.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/projects)" = "503"
          docker logs studio
