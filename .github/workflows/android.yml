name: Android app

# Builds the Android app (APK) that opens the hosted AI Code Studio site.
# Download it from the run's "Artifacts" section.

on:
  push:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Website the app opens (leave empty for the default)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          if [ -n "$APP_URL" ]; then
            gradle --no-daemon assembleRelease "-PappUrl=$APP_URL"
          else
            gradle --no-daemon assembleRelease
          fi
      - name: Check the APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk" | head -3
          "$tools/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|launchable-activity)"
          "$tools/aapt2" dump badging "$apk" | grep -q "launchable-activity: name='com.aicodestudio.app.MainActivity'"
          echo "::notice title=APK::$("$tools/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion)" | paste -sd ' ' -), $(stat -c %s "$apk") bytes"
          mkdir -p ../apk-out
          cp "$apk" ../apk-out/ai-code-studio.apk
          ls -l ../apk-out
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Code-Studio-Android
          path: apk-out/ai-code-studio.apk
          if-no-files-found: error
          retention-days: 90

  launch:
    name: Launch test (emulator)
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AI-Code-Studio-Android
          path: apk-out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, open and check the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/launch-test.sh apk-out/ai-code-studio.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test-screenshots
          path: shots
          if-no-files-found: warn
          retention-days: 7
