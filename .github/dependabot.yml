version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The Android toolchain (AGP, Kotlin, KSP, Compose, AndroidX) is a
      # coordinated, CI-verified baseline. Major bumps need a deliberate
      # migration (Gradle wrapper + AGP + compiler DSL together) and must not
      # be auto-proposed as isolated changes. Minor/patch updates still flow.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Kotlin and KSP are a version-locked compiler pair (KSP also enforces a
      # minimum AGP). Even a "minor" KSP/Kotlin bump breaks the build unless the
      # whole toolchain moves together, so leave these to a manual migration.
      # Match both the version-catalog ref names and the plugin ids.
      - dependency-name: "kotlin"
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "ksp"
      - dependency-name: "com.google.devtools.ksp*"
